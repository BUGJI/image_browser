appId: com.bugji.image-browser
productName: image-browser
# 不指定 electronDist：Electron 43 起 npm 包不再自带 postinstall 下载运行时，
# 由 electron-builder 自行按版本获取 Electron 发行包（本地与 CI 均可）。
# 源代码经 Vite 打包，asar 归档 + 最大压缩减小安装体积
asar: true
compression: maximum
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 仓库内的构建脚本、CI、文档、source map 无需随包分发
  - '!scripts/**'
  - '!build/**/*.py'
  - '!.github/**'
  - '!docs/**'
  - '!**/*.map'
  - '!**/*.md'
  - '!**/{test,tests,__tests__,example,examples,docs}/**'
  # OCR 运行时（onnxruntime + sharp）体积过大，不打进安装包，由「设置-模型管理」按需下载/导入
  - '!node_modules/onnxruntime-node/**'
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/sharp/**'
  - '!node_modules/@img/**'
  # @repeato/ocr 的浏览器构建运行时不会加载，剔除以减小体积
  - '!node_modules/@repeato/ocr/build/browser/**'
asarUnpack:
  - resources/**
  - out/main/cache-worker.js
  - out/main/ocr-worker.js
  # @repeato/ocr（含模型）随包内置，模型文件需从 asar 解包以便 fs 读取
  - node_modules/@repeato/**
win:
  executableName: image-browser
  # 外部转换器仅 Windows 使用，按平台打包，避免进入 mac/linux 产物
  extraResources:
    - from: image_compressor.exe
      to: image_compressor.exe
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # appId 已由 com.openclaw.image-browser 迁移为 com.bugji.image-browser。
  # NSIS 默认用 appId 派生安装标识 GUID，改 appId 会让已安装用户被识别成另一个应用
  # （旧版残留、升级不覆盖、出现两份安装）。这里显式固定为旧 appId 派生出的 GUID，
  # 从而保留既有用户的升级路径。切勿随意改动此值。
  guid: 2387fdee-c6d9-5b1b-a1c4-49c0c0d6faab
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: BUGJI
  category: Graphics
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: BUGJI
  repo: image_browser

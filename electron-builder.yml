appId: com.openclaw.image-browser
productName: image-browser
electronDist: node_modules/electron/dist
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # OCR 运行时（onnxruntime + sharp）体积过大，不打进安装包，由「设置-模型管理」按需下载/导入
  - '!node_modules/onnxruntime-node/**'
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/sharp/**'
  - '!node_modules/@img/**'
  # 仓库内的调试脚本 / 构建脚本无需随包分发
  - '!locate-dir.mjs'
  - '!thumb-child.js'
  - '!worker-thumb-test.mjs'
  - '!scripts/**'
  - '!build/**/*.py'
  # @repeato/ocr 的浏览器构建与 source map 运行时不会加载，剔除以减小体积
  - '!node_modules/@repeato/ocr/build/browser/**'
  - '!node_modules/@repeato/**/*.map'
asarUnpack:
  - resources/**
  - out/main/cache-worker.js
  - out/main/ocr-worker.js
  # @repeato/ocr（含模型）随包内置，模型文件需从 asar 解包以便 fs 读取
  - node_modules/@repeato/**
extraResources:
  - from: image_compresser.exe
    to: image_compresser.exe
win:
  executableName: image-browser
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: openclaw
  category: Graphics
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: BUGJI
  repo: image_browser
